# Lexicon: personal vocabulary for voice-to-agents.
# canonical: the spelling you want; aliases: what STT actually hears.
#
# Each term may also carry: phonetic (pronunciation hint), category
# (brand|person|product|acronym|identifier|place|other), notes (shown to the
# agent), never (words that must not be rewritten to this canonical).
# settings: minConfidence, phonetic, fuzzy, protectedWords, skipCode.

version: 1
settings:
  minConfidence: 0.82
  phonetic: true
  fuzzy: true
  skipCode: true
terms:
  - canonical: Ashlr.AI
    aliases:
      - Ashler
      - Ashlar
      - Ashler AI
      - Ashlar AI
      - Ashley our AI
    phonetic: ASH-ler
    category: brand
    notes: My company. Never write "Ashlar" (that is a masonry term).
    never: []
    hits: 1
  - canonical: Kubernetes
    aliases:
      - Cooper Nettie's
      - cube or netties
      - k8s
    phonetic: koo-ber-NET-eez
    category: product
    never: []
  - canonical: SaaS
    aliases:
      - sass
    category: acronym
    never:
      - sauce
  - canonical: Pydantic
    aliases:
      - pie dentic
      - pie dantic
    phonetic: pie-DAN-tick
    category: product
    never: []
  - canonical: Hetzner
    aliases:
      - head sner
      - hetsner
    phonetic: HETS-ner
    category: brand
    notes: Hosting provider.
    never: []
  - canonical: Mason Wyatt
    aliases:
      - Mason White
      - Mason Wyat
    category: person
    notes: Founder, Ashlr.AI.
    never: []
  - canonical: PostgreSQL
    aliases:
      - postgres sequel
      - post gress
      - post gres
    phonetic: POST-gress
    category: product
    never: []
  - canonical: LexiconStore
    aliases:
      - lexicon store
      - lexicon storage
    category: identifier
    notes: The class in src/core/store.ts.
    never: []
    source: harvest:repo
