# Starter pack: AI models, labs, tooling and vocabulary. `lexicon pack add ai`.
# Aliases follow the same rule as every pack: real STT spellings where the
# benchmark recorded one ("and Tropic" for Anthropic, "Olima" for Ollama), plausible
# splits elsewhere ("cloud code", "code x"), never an ordinary English word on its
# own (Claude -> "cloud" is left out because "the cloud" is a sentence people say).
name: ai
title: AI models and tools
description: Labs, models, frameworks, coding agents and the vocabulary of working with LLMs.
version: 1
terms:
  # ------------------------------------------------------------ labs, models
  - canonical: OpenAI
    category: brand
    aliases: [open a i, open eye]
  - canonical: ChatGPT
    category: product
    aliases: [chat g p t, chat gpt, chat gbt, chat gp t]
  - canonical: GPT
    category: acronym
    aliases: [g p t, gee pee tee, gbt]
