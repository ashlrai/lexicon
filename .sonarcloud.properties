# SonarQube Cloud Automatic Analysis. No workflow and no token.
sonar.organization=ashlrai
sonar.projectKey=ashlrai_lexicon

sonar.sources=src,extension/src,web,site,scripts,apps/macos/LexiconBar/Sources,apps/windows/src,packaging
sonar.tests=tests,apps/macos/LexiconBar/Tests,apps/windows/tests

# Generated bundles, vendored installs, build output, and test fixtures.
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-firefox/**,plugin/**,coverage/**,**/.build/**,**/bin/**,**/obj/**,**/.next/**,**/*.zip,bench/audio/out/**,bench/audio/models/**
sonar.test.exclusions=tests/fixtures/**,**/fixtures/**
