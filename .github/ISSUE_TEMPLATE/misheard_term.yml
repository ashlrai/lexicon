name: Add a misheard term
description: Propose a public term for a starter pack (packs/*.yaml) or the example lexicon.
labels: [lexicon, good first issue]
body:
  - type: markdown
    attributes:
      value: |
        A lightweight way to grow the starter packs. Only public names belong here (products, tools, companies, well-known people). Your own company or teammates go in your personal file (`lexicon add`).

        An ordinary English word is never an alias on its own ("cloud" for Claude, "vessel" for Vercel), so leave those out. To send the pull request yourself, follow [Adding a term to a shipped pack](https://github.com/ashlrai/lexicon/blob/main/docs/PACKS.md#adding-a-term-to-a-shipped-pack).
  - type: input
    id: canonical
    attributes:
      label: Canonical spelling
      placeholder: Kubernetes
    validations:
      required: true
  - type: input
    id: aliases
    attributes:
      label: What speech-to-text writes
      description: Comma-separated. Real transcripts beat guesses.
      placeholder: Cooper Nettie's, kubernetees, cube or netties
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [brand, person, product, acronym, identifier, place, other]
    validations:
      required: true
  - type: dropdown
    id: pack
    attributes:
      label: Which pack it fits (optional)
      options: [not sure, developer, ai, business, voice-tools, cloud-devops, legal, profession-q8, architecture, ashlr, a new pack]
  - type: input
    id: phonetic
    attributes:
      label: Pronunciation hint (optional)
      placeholder: koo-ber-NET-eez
  - type: input
    id: engine
    attributes:
      label: Which STT produced it (optional)
      placeholder: Wispr Flow, Superwhisper, Claude Code /voice, Whisper large-v3
