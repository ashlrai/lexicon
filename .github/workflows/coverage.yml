name: Coverage

# The suite that produces lcov runs only in the merge queue.
# Pull requests and pushes keep the CI workflow, which does not collect coverage
# and does not get id-token. This file is not a required check.
on:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test with coverage
        shell: bash
        run: |
          set -euo pipefail
          # --project unit leaves out the perf project. Those two files are
          # wall-clock budgets, and v8 coverage makes the 20ms matcher case
          # miss on the probe itself. The CI workflow still runs them, without
          # coverage, on push and pull_request.
          npx vitest run --project unit --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=coverage
          if [ ! -s coverage/lcov.info ]; then
            echo "coverage/lcov.info is missing"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 5

  upload:
    name: Upload coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage-lcov
          path: coverage

      - name: Require the coverage file
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s coverage/lcov.info ]; then
            echo "coverage/lcov.info is missing"
            exit 1
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
