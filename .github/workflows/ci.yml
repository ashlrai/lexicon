name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Smoke test the built CLI
        env:
          LEXICON_PATH: ${{ github.workspace }}/examples/lexicon.example.yaml
        run: |
          out="$(node dist/cli/index.js normalize "ping ashler")"
          echo "normalize -> $out"
          echo "$out" | grep -q "Ashlr.AI"

      - name: Smoke test the MCP server starts
        run: |
          # The server must start and stay alive on stdio; kill it after a moment.
          timeout 5 node dist/mcp/server.js < /dev/null > /dev/null 2> server.err || code=$?
          # 124 = killed by timeout (server was healthy); 0 = clean EOF exit. Anything else is a crash.
          if [ "${code:-0}" != "0" ] && [ "${code:-0}" != "124" ]; then cat server.err; exit 1; fi
