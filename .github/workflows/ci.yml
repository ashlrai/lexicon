name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Plugin bundle is up to date
        run: |
          npm run build:bundle
          git diff --exit-code --stat -- plugin
          untracked="$(git ls-files --others --exclude-standard -- plugin)"
          if [ -n "$untracked" ]; then echo "untracked bundle files: $untracked"; exit 1; fi

      - run: npm test

      - name: Smoke test the built CLI
        env:
          LEXICON_PATH: ${{ github.workspace }}/examples/lexicon.example.yaml
        run: |
          out="$(node dist/cli/index.js normalize "ping ashler")"
          echo "normalize -> $out"
          echo "$out" | grep -q "Ashlr.AI"

      - name: Smoke test the bundled plugin hook
        env:
          LEXICON_PATH: ${{ github.workspace }}/examples/lexicon.example.yaml
        run: |
          out="$(echo '{"hook_event_name":"UserPromptSubmit","prompt":"ping ashler"}' | node plugin/hook.mjs)"
          echo "hook -> $out"
          echo "$out" | grep -q "Ashlr.AI"
          out="$(echo '{"hook_event_name":"SessionStart","source":"startup"}' | node plugin/hook.mjs)"
          echo "$out" | grep -q '"hookEventName":"SessionStart"'

      - name: Smoke test the MCP server starts
        run: |
          # The server must start and stay alive on stdio; kill it after a moment.
          timeout 5 node dist/mcp/server.js < /dev/null > /dev/null 2> server.err || code=$?
          # 124 = killed by timeout (server was healthy); 0 = clean EOF exit. Anything else is a crash.
          if [ "${code:-0}" != "0" ] && [ "${code:-0}" != "124" ]; then cat server.err; exit 1; fi

      - name: Build the browser extension
        run: npm run build:extension

      - name: Upload the browser extension
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-extension
          path: extension/dist
          if-no-files-found: error

  # Documentation drift guards (issue #9). A job of its own rather than three
  # more steps in the Node matrix, so each check runs once.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Every relative link resolves
        run: npm run check:links

      - name: The numbers in the docs match the code
        # Derives the MCP tool/resource/prompt counts from the built server over
        # stdio, the command count from `lexicon --help`, and the format, pack,
        # stoplist and test counts from the code, then fails on any doc that
        # disagrees. Needs dist/, hence the build.
        run: |
          npm run build
          npm run check:facts

      - name: CLI reference is up to date
        run: |
          npm run docs:cli
          git diff --exit-code --stat -- docs/CLI.md
