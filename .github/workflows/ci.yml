name: CI

on:
  push:
    # `ci/**` as well as main: a cross-platform matrix is only worth having if
    # it can be run before the change reaches main, and a branch push is the
    # cheapest way to get that without opening a pull request first.
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
    # `labeled` so adding `ci:macos` to an open PR starts a run with the macOS row.
    types: [opened, synchronize, reopened, labeled]

# Superseded branch and PR runs are cancelled. Every push to main gets its own
# group (keyed by SHA): with one shared main group, a run whose macOS row sat
# in the shared macOS queue held the next main run pending behind it, and
# that one cancelled the run pending before it, so main went hours without a
# result and some commits were never tested at all.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The portable suite: every platform, and the three supported Node majors on
  # Linux so the matrix stays five jobs rather than nine. Node 22 is the version
  # macOS and Windows run, because that is the floor for the jsdom extension
  # suite (see vitest.config.ts) -- a Windows job on Node 20 would silently skip
  # it and the Windows column would mean less than it appears to.
  # ---------------------------------------------------------------------------
  # Which rows `test` runs. Pushes: all five, macOS included, as before. Pull
  # requests: Linux + Windows, plus macOS only when the PR carries the
  # `ci:macos` label or touches the timing-sensitive paths below (the hook and
  # its wall-clock budgets, correction parsing, the matcher and normalizer and
  # their perf tests, and this workflow). #197 was a macOS-only failure of a
  # wall-clock budget in the hook that no PR row could have caught.
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.rows.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Pick rows
        id: rows
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
        run: |
          base='{"os":"ubuntu-latest","node":20},{"os":"ubuntu-latest","node":22},{"os":"ubuntu-latest","node":24},{"os":"windows-latest","node":22}'
          mac=true
          if [ "$EVENT" = "pull_request" ] && [ "$LABELED" != "true" ]; then
            # An unreadable diff runs macOS too, like the docs-only check below.
            if files="$(git diff --name-only "$BASE...HEAD")"; then
              if ! printf '%s\n' "$files" | grep -Eq '^(src/hooks/|src/core/(learn|matcher|normalize)\.ts$|tests/(hook[^/]*|learn|matcher[^/]*|normalize)\.test\.ts$|\.github/workflows/ci\.yml$)'; then
                mac=false
              fi
            fi
          fi
          if [ "$mac" = true ]; then
            echo "include=[$base,{\"os\":\"macos-latest\",\"node\":22}]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$base]" >> "$GITHUB_OUTPUT"
          fi
          echo "macos row: $mac"

  test:
    name: ${{ matrix.os }} node ${{ matrix.node }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill ~10x Linux and queue ~3 min, so pull requests run
        # the Linux + Windows rows (the fast gate) and the macOS row runs on
        # every push to main and ci/** (and again in release.yml before any
        # publish), and on a PR only when `plan` says so (label `ci:macos` or
        # a timing-sensitive path).
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      # Before checkout, or it has already rewritten the worktree. Git for
      # Windows sets core.autocrlf=true globally, which would hand every
      # tracked text file to the build with CRLF endings -- and two CI gates
      # here are `git diff --exit-code` against generated files written with
      # LF. The repo has no .gitattributes to pin this, so the workflow does.
      - name: Keep LF endings on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Docs-only PRs (only docs/**/*.md or top-level *.md) keep the whole
      # ubuntu node 22 row, which runs the doc gates (links, CLI reference, the
      # numbers in the docs, which runs the full vitest suite, so no-dashes and
      # every doc-reading test still run). The Windows row keeps install, build,
      # links and the CLI reference (the CRLF check). Every other step, and all
      # of the node 20 and 24 rows, are skipped, but each job still runs and
      # reports, so no required check strands. Pushes, and any PR touching
      # another path (including #179's serve, install, setup and atomic-writer
      # paths), run everything. If the diff cannot be read, everything runs.
      - name: Classify changes
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] && files="$(git diff --name-only "$BASE...HEAD")" && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -Evq '^(docs/.*\.md|[A-Za-z_-]+\.md)$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full row: $code"

      - uses: actions/setup-node@v7
        if: (steps.scope.outputs.code == 'true' || matrix.node == 22)
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Release publication contract (offline synthetic fixtures)
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        run: node --test scripts/release-contract.test.mjs

      - run: npm ci
        if: (steps.scope.outputs.code == 'true' || matrix.node == 22)

      - run: npm run typecheck
        if: (steps.scope.outputs.code == 'true' || matrix.node == 22)

      - run: npm run build
        if: (steps.scope.outputs.code == 'true' || matrix.node == 22)

      - name: Plugin bundle is up to date
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22))
        # Git Bash rather than pwsh, so the one conditional reads the same as
        # it does locally. `timeout`/`/dev/null` are what Git Bash cannot be
        # trusted with; `git ls-files` and `[ -n ]` are fine.
        shell: bash
        run: |
          npm run build:bundle
          git diff --exit-code --stat -- plugin
          untracked="$(git ls-files --others --exclude-standard -- plugin)"
          if [ -n "$untracked" ]; then echo "untracked bundle files: $untracked"; exit 1; fi

      # PRs run only the vitest files whose import graph reaches a changed
      # file (vitest --changed), plus tests/e2e.test.ts, which spawns the real
      # CLI, the real hook and the real MCP server as child processes and runs
      # on every event. Any change to dependencies, configs, fixtures or CI
      # falls back to the full suite, and pushes to main always run it.
      # So does any change to serve, install, setup or uninstall code or the
      # atomic writer: their tests depend on per-OS paths (realpath, temp
      # dirs) that the import graph does not capture (main went red at e894620).
      # One vitest invocation: e2e is the slowest file (~40-80 s) and runs in
      # one worker while the other workers take the remaining files. Run as a
      # separate step it added its whole duration to the job; a failure is
      # still named by file and test in the report.
      - name: Tests (affected on PRs plus e2e, full on main)
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22))
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          # e2e spawns the dist/ built above under plain node rather than the
          # sources under tsx: same code, half the e2e time (no loader per spawn).
          LEXICON_E2E_DIST: '1'
        run: |
          if [ "$EVENT" = "pull_request" ] && ! git diff --name-only "$BASE...HEAD" | grep -Eq '^(package(-lock)?\.json|vitest\.config\.ts|tsconfig[^/]*\.json|tests/fixtures/|examples/|packs/|registry/|\.github/|src/serve/|src/cli/(cmd-(serve|install|setup|uninstall)\.ts|serve-paths\.ts|setup/)|src/util/atomic\.ts)'; then
            # A failed listing must fail the step, never shrink the run to e2e.
            list="$(npx vitest list --changed "$BASE" --filesOnly)"
            mapfile -t affected <<< "$list"
            [ -n "${affected[0]}" ] || affected=()
            echo "affected test files (${#affected[@]}) plus tests/e2e.test.ts"
            npx vitest run "${affected[@]}" tests/e2e.test.ts
          else
            npm test
          fi

      # Always runs, whatever a PR touched: the affected-files step above picks
      # tests by import graph, and an accuracy regression should never depend on
      # that. The corpus is synthetic (hand-written STT errors, text only), so
      # these thresholds guard the matcher against regressions; they are not a
      # claim about real dictation (see bench/README.md and docs/BENCHMARK.md).
      - name: Benchmark regression gate (synthetic corpus)
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        run: npx vitest run bench/bench.test.ts

      - name: Smoke test the built CLI, the plugin hook and the MCP server
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22))
        run: npm run smoke

      # The tarball a release would publish, installed into an empty project and
      # driven through the CLI, MCP and hook surface Phantom relies on.
      - name: Packed package installs and keeps the Phantom contract
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        run: node scripts/pack-smoke.mjs

      - name: Build the browser extension
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22))
        run: npm run build:extension

      - name: Upload the browser extension
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        uses: actions/upload-artifact@v7
        with:
          name: lexicon-extension
          path: extension/dist
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # Documentation drift guards, once per platform that can meaningfully run
      # them: the Node 22 row on Linux and on Windows. They used to be their own
      # job, which cost two more runners (each with its own checkout, setup-node
      # and npm ci) and two more places to queue; here they reuse this job's
      # install and build.
      # -----------------------------------------------------------------------
      - name: Every relative link resolves
        if: (steps.scope.outputs.code == 'true' || matrix.node == 22) && (matrix.node == 22 && runner.os != 'macOS')
        # Runs on Windows too, but ubuntu is the authoritative result: NTFS is
        # case-insensitive, so a link written `docs/cli.md` against the real
        # `docs/CLI.md` resolves here and fails on Linux. The Windows run
        # proves the script itself is portable, not that the links are right.
        run: npm run check:links

      - name: CLI reference is up to date
        if: (steps.scope.outputs.code == 'true' || matrix.node == 22) && (matrix.node == 22 && runner.os != 'macOS')
        # The interesting platform for this one is Windows: gen-cli-docs
        # embeds the CLI's own --help output verbatim inside fenced blocks, and
        # commander writes CRLF there. An un-normalized \r would be *committed
        # content*, so this diff is the thing that catches it.
        run: |
          npm run docs:cli
          git diff --exit-code --stat -- docs/CLI.md

      - name: The numbers in the docs match the code
        # ubuntu only, deliberately: this derives the TypeScript test count by
        # running the whole vitest suite, which the test matrix has already run
        # on all three platforms. Doc drift is a property of the repo, not of
        # the OS, so a second full run on Windows would cost ~5 minutes to
        # assert the same numbers. The script itself is Windows-clean (it
        # spawns vitest's ESM entry with process.execPath, not the npx shim).
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        run: npm run check:facts

      # -----------------------------------------------------------------------
      # Windows features that unit tests only ever exercise through injected fakes.
      # Everything here uses the real schtasks, the real clipboard and a real
      # scratch %USERPROFILE%. Last in the job, so nothing they install or write
      # can reach the tests above.
      # -----------------------------------------------------------------------
      # --- lexicon serve --install -----------------------------------------
      # The task is created, queried back out of the Task Scheduler store, and
      # deleted in the same job. LEXICON_SERVE_LABEL keeps it off the name a
      # real install would use.
      - name: serve --install creates a Scheduled Task, --uninstall removes it
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (runner.os == 'Windows')
        shell: pwsh
        env:
          LEXICON_SERVE_LABEL: LexiconCI
          LEXICON_PATH: ${{ github.workspace }}\examples\lexicon.example.yaml
        run: |
          $ErrorActionPreference = 'Stop'
          node dist/cli/index.js serve --install
          if ($LASTEXITCODE -ne 0) { throw "serve --install exited $LASTEXITCODE" }

          # It must be in the store, and its action must point at this checkout.
          $xml = schtasks /Query /TN LexiconCI /XML
          if ($LASTEXITCODE -ne 0) { throw 'schtasks could not find the task that --install claimed to create' }
          $xml = $xml -join "`n"
          Write-Host $xml
          if ($xml -notmatch '<LogonTrigger>') { throw 'the task has no logon trigger' }
          if ($xml -notmatch [regex]::Escape('dist\cli\index.js')) { throw 'the task does not run this checkout' }

          # The doctor must agree that it is installed and healthy.
          $doctor = node dist/cli/index.js doctor 2>&1 | Out-String
          Write-Host $doctor
          if ($doctor -notmatch 'LexiconCI') { throw 'doctor does not see the Scheduled Task' }

          node dist/cli/index.js serve --uninstall
          if ($LASTEXITCODE -ne 0) { throw "serve --uninstall exited $LASTEXITCODE" }

          schtasks /Query /TN LexiconCI 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'the task survived --uninstall' }
          Write-Host 'Scheduled Task created, verified and removed.'
          # That last schtasks is *meant* to fail, and GitHub's pwsh wrapper
          # ends the step with `exit $LASTEXITCODE`, so without this the step
          # reports failure after printing success. Real failures throw above.
          exit 0

      # --- the PowerShell clipboard backend --------------------------------
      # The unit tests inject a fake exec; this drives the real
      # Get-Clipboard/Set-Clipboard through `lexicon daemon --once`, including
      # the CRLF round-trip the backend promises.
      - name: clipboard daemon corrects the real Windows clipboard
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (runner.os == 'Windows')
        shell: pwsh
        env:
          LEXICON_PATH: ${{ github.workspace }}\examples\lexicon.example.yaml
        run: |
          $ErrorActionPreference = 'Stop'
          node dist/cli/index.js daemon --which
          if ($LASTEXITCODE -ne 0) { throw 'no clipboard backend detected on Windows' }

          # Two lines with Windows endings: the backend normalizes to \n for
          # the matcher and must put \r\n back on the way out.
          Set-Clipboard -Value "ping ashler`r`nsecond line"
          node dist/cli/index.js daemon --once
          if ($LASTEXITCODE -ne 0) { throw "daemon --once exited $LASTEXITCODE" }

          $out = Get-Clipboard -Raw
          Write-Host ('clipboard now: ' + ($out -replace "`r", '\r' -replace "`n", '\n'))
          if ($out -notmatch 'Ashlr\.AI') { throw 'the clipboard was not corrected' }
          if ($out -notmatch "`r`n") { throw 'CRLF was not preserved through the round trip' }
          if ($out -notmatch 'second line') { throw 'the second line was lost' }
          exit 0

      # --- client config paths ---------------------------------------------
      # Writes each client's config into a scratch %USERPROFILE% and reads it
      # back, so the paths are checked against the filesystem rather than
      # against our own constant.
      - name: client configs land where each vendor documents on Windows
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (runner.os == 'Windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP 'lexhome'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          $env:USERPROFILE = $scratch
          $env:APPDATA = Join-Path $scratch 'AppData\Roaming'
          $env:HOME = $scratch
          $env:LEXICON_PATH = Join-Path $scratch 'lexicon.yaml'

          node dist/cli/index.js install claude-desktop --apply
          node dist/cli/index.js install cursor --apply
          node dist/cli/index.js install vscode --apply
          node dist/cli/index.js install codex --apply
          node dist/cli/index.js install gemini --apply

          # %APPDATA%\Claude\claude_desktop_config.json and
          # %APPDATA%\Code\User\mcp.json are the documented Windows locations;
          # the other three are `~`-relative, which is %USERPROFILE% here.
          $expected = @(
            (Join-Path $env:APPDATA 'Claude\claude_desktop_config.json'),
            (Join-Path $env:APPDATA 'Code\User\mcp.json'),
            (Join-Path $scratch '.cursor\mcp.json'),
            (Join-Path $scratch '.codex\config.toml'),
            (Join-Path $scratch '.gemini\settings.json')
          )
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) { throw "missing: $f" }
            $body = Get-Content $f -Raw
            if ($body -notmatch 'lexicon') { throw "no lexicon entry in $f" }
            Write-Host "ok  $f"
          }
          exit 0

      # --- voice, as far as a runner without a microphone can go ------------
      # Device enumeration and recording need real audio hardware, so they are
      # not attempted. What is checked is that the missing-tool path reports
      # the Windows install hint rather than crashing. See docs/PLATFORMS.md.
      - name: voice reports the Windows install hint when ffmpeg is absent
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (runner.os == 'Windows')
        shell: pwsh
        env:
          LEXICON_FFMPEG_BIN: C:\nowhere\ffmpeg.exe
          LEXICON_WHISPER_BIN: C:\nowhere\whisper-cli.exe
        run: |
          $out = node dist/cli/index.js voice --list-devices 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'winget install Gyan.FFmpeg') { throw 'the Windows ffmpeg install hint is missing' }
          # `voice --list-devices` exits non-zero when ffmpeg is absent, which
          # is exactly the path under test; the assertion above is the verdict.
          exit 0

      # -----------------------------------------------------------------------
      # Linux beyond the happy path: the X11 clipboard backends under a real X
      # server, and the systemd unit we write validated by systemd itself. Node 22
      # row only, and last, for the same reasons as the Windows block.
      # -----------------------------------------------------------------------
      - name: Install a display and the clipboard tools
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xclip xsel wl-clipboard systemd

      # xclip and xsel need a display. xvfb-run gives them one, so these run
      # for real instead of being skipped for want of an X server.
      - name: clipboard daemon corrects the real clipboard under X11
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        env:
          LEXICON_PATH: ${{ github.workspace }}/examples/lexicon.example.yaml
        run: |
          set -euo pipefail
          for backend in xclip xsel; do
            echo "--- $backend ---"
            xvfb-run -a --server-args='-screen 0 1024x768x24' bash -eu -c "
              node dist/cli/index.js daemon --which --backend $backend
              printf 'ping ashler\nsecond line' | $backend $([ $backend = xclip ] && echo '-selection clipboard -i' || echo '--clipboard --input')
              node dist/cli/index.js daemon --once --backend $backend
              out=\$($backend $([ $backend = xclip ] && echo '-selection clipboard -o' || echo '--clipboard --output'))
              echo \"clipboard now: \$out\"
              echo \"\$out\" | grep -q 'Ashlr.AI'
              echo \"\$out\" | grep -q 'second line'
            "
          done

      # WAYLAND_DISPLAY is what selects the wl backend, and there is no
      # compositor on the runner, so this asserts detection and the error the
      # user would actually see -- not a working Wayland clipboard.
      - name: the Wayland backend is selected by WAYLAND_DISPLAY and fails honestly without a compositor
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        env:
          LEXICON_PATH: ${{ github.workspace }}/examples/lexicon.example.yaml
        run: |
          set -uo pipefail
          out="$(WAYLAND_DISPLAY=wayland-0 DISPLAY= node dist/cli/index.js daemon --which 2>&1)" || true
          echo "$out"
          echo "$out" | grep -q 'wl-paste'
          out="$(WAYLAND_DISPLAY=wayland-0 DISPLAY= node dist/cli/index.js daemon --once --backend wl 2>&1)" || true
          echo "$out"
          # A missing compositor must surface, not be swallowed as "empty clipboard".
          echo "$out" | grep -Eqi 'wayland|compositor|display|wl-paste'

      # `systemctl --user` has no session bus on a GitHub runner, so `--install`
      # writes the unit and then fails to enable it. That is expected: what is
      # verified here is that the unit file we write is one systemd accepts.
      - name: the systemd user unit we write is valid
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        env:
          LEXICON_PATH: ${{ github.workspace }}/examples/lexicon.example.yaml
        run: |
          set -uo pipefail
          node dist/cli/index.js serve --install || echo "--install exited non-zero (expected: no user session bus on the runner)"
          unit="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/lexicon-serve.service"
          test -f "$unit" || { echo "no unit written at $unit"; exit 1; }
          cat "$unit"
          # systemd-analyze verify is the authority on whether this parses and
          # whether ExecStart points at something runnable.
          systemd-analyze verify "$unit"
          node dist/cli/index.js serve --uninstall || true

      # XDG_CONFIG_HOME / XDG_DATA_HOME / XDG_STATE_HOME must actually move the
      # files, and a relative value must be ignored per the spec.
      - name: XDG_CONFIG_HOME moves the lexicon, and a relative value is ignored
        if: (steps.scope.outputs.code == 'true' || (matrix.os == 'ubuntu-latest' && matrix.node == 22)) && (matrix.os == 'ubuntu-latest' && matrix.node == 22)
        run: |
          set -euo pipefail
          xdg="$RUNNER_TEMP/xdg"
          mkdir -p "$xdg"
          out="$(XDG_CONFIG_HOME="$xdg" node dist/cli/index.js path)"
          echo "$out"
          echo "$out" | grep -q "$xdg/lexicon/lexicon.yaml"
          # The spec says a relative path is invalid and must be ignored.
          out="$(XDG_CONFIG_HOME=relative/dir node dist/cli/index.js path)"
          echo "$out"
          echo "$out" | grep -q "$HOME/.config/lexicon/lexicon.yaml"
