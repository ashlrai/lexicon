# Builds the LexiconBar menu bar app (apps/macos/LexiconBar) and uploads the
# ad-hoc signed .app zip as a workflow artifact. Separate from ci.yml so the
# Node test matrix does not wait on a macOS runner.
name: macOS app

# Desktop app builds run with the scheduled full suite (6 AM and 6 PM ET) and
# on dispatch, not on PRs or pushes. A red scheduled run files a P0
# FIX-MAIN issue (fix-main.yml).
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs only; main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: |
            apps/macos/LexiconBar/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/LexiconBar/Package.swift', 'apps/macos/LexiconBar/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build (release)
        working-directory: apps/macos/LexiconBar
        run: swift build -c release

      - name: Unit tests (LexiconBarKit)
        working-directory: apps/macos/LexiconBar
        run: swift test

      - name: Package LexiconBar.app
        run: scripts/build-macos-app.sh

      - name: Verify bundle
        run: |
          plutil -lint apps/macos/build/LexiconBar.app/Contents/Info.plist
          codesign --verify --verbose=2 apps/macos/build/LexiconBar.app
          ls -la apps/macos/build

      - uses: actions/upload-artifact@v7
        with:
          name: LexiconBar.app
          path: apps/macos/build/LexiconBar.app.zip
          if-no-files-found: error
