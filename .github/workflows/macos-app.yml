# Builds the LexiconBar menu bar app (apps/macos/LexiconBar) and uploads the
# ad-hoc signed .app zip as a workflow artifact. Separate from ci.yml so the
# Node test matrix does not wait on a macOS runner.
name: macOS app

# Desktop app builds run after a main push that touches this app, on the daily
# schedule, and on dispatch. Not on PRs or the merge queue. A red scheduled
# run files a P0 FIX-MAIN issue (fix-main.yml).
on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "scripts/build-macos-app.sh"
      - "package.json"
      - ".github/workflows/macos-app.yml"
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A burst of pushes to one ref shares a group and the newer run cancels the
# older. Schedule and dispatch keep a per-run group so a main push cannot
# cancel them.
concurrency:
  group: macos-app-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/macos/LexiconBar/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/macos/LexiconBar/Package.swift', 'apps/macos/LexiconBar/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build (release)
        working-directory: apps/macos/LexiconBar
        run: swift build -c release

      - name: Unit tests (LexiconBarKit)
        working-directory: apps/macos/LexiconBar
        run: swift test

      - name: Package LexiconBar.app
        run: scripts/build-macos-app.sh

      - name: Verify bundle
        run: |
          plutil -lint apps/macos/build/LexiconBar.app/Contents/Info.plist
          codesign --verify --verbose=2 apps/macos/build/LexiconBar.app
          ls -la apps/macos/build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LexiconBar.app
          path: apps/macos/build/LexiconBar.app.zip
          if-no-files-found: error
