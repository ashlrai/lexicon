# Qualify every asset before publication. Preserve the original npm archive.
# An existing release/version is refused; recovery is a reviewed fix-forward release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  full-suite-evidence:
    # Release gate: the full suite (macOS and Windows included) must have
    # passed in a manual workflow_dispatch run of CI on this exact sha.
    name: Full suite green on release sha
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Require a successful workflow_dispatch CI run on this sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CI_WORKFLOW: ci.yml
        run: |
          set -euo pipefail
          n="$(gh api "repos/${REPO}/actions/workflows/${CI_WORKFLOW}/runs?event=workflow_dispatch&head_sha=${SHA}&status=success&per_page=1" --jq '.total_count')"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::No successful workflow_dispatch run of ${CI_WORKFLOW} on ${SHA}. Run 'gh workflow run ${CI_WORKFLOW} --ref <this ref>', wait for green, then release."
            exit 1
          fi
          echo "full suite green on ${SHA} (${n} run(s))"

  ubuntu:
    needs: [full-suite-evidence]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate all source version carriers
        id: meta
        run: |
          version=$(node scripts/release-contract.mjs source . "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: node --test scripts/release-contract.test.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:bundle
      - run: npm test
      - run: npm run check:facts
      - run: npm run check:server-json -- --offline
      - name: Verify generated CLI documentation
        run: npm run docs:cli && git diff --exit-code -- docs/CLI.md
      - name: Build the browser extension zips
        run: npm run build:extension
      - name: Pack qualified npm bytes once
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cp extension/lexicon-extension.zip extension/lexicon-extension-firefox.zip release/
          node scripts/release-contract.mjs checksum release "$VERSION" ubuntu
      - uses: actions/upload-artifact@v7
        with:
          name: lexicon-release-ubuntu
          path: release/*
          if-no-files-found: error

  macos:
    needs: [full-suite-evidence]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate all source version carriers
        run: node scripts/release-contract.mjs source . "$GITHUB_REF_NAME"
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Unit tests (LexiconBarKit)
        working-directory: apps/macos/LexiconBar
        run: swift test
      - name: Package LexiconBar.app
        run: scripts/build-macos-app.sh
      - name: Verify bundle and capture qualified checksum
        run: |
          plutil -lint apps/macos/build/LexiconBar.app/Contents/Info.plist
          codesign --verify --verbose=2 apps/macos/build/LexiconBar.app
          mkdir release
          cp apps/macos/build/LexiconBar.app.zip release/
          version=$(node scripts/release-contract.mjs source . "$GITHUB_REF_NAME")
          node scripts/release-contract.mjs checksum release "$version" macos
      - uses: actions/upload-artifact@v7
        with:
          name: lexicon-release-macos
          path: release/*
          if-no-files-found: error

  publish:
    needs: [ubuntu, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.ubuntu.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Revalidate source identity
        run: |
          version=$(node scripts/release-contract.mjs source . "$GITHUB_REF_NAME")
          test "$version" = "$VERSION"
      - uses: actions/download-artifact@v8
        with:
          name: lexicon-release-ubuntu
          path: staged/ubuntu
      - uses: actions/download-artifact@v8
        with:
          name: lexicon-release-macos
          path: staged/macos
      - name: Validate complete qualified artifact closure
        run: node scripts/release-contract.mjs assemble staged release "$VERSION"
      # npm trusted publishing (OIDC): npm >= 11.5.1 exchanges this job's
      # id-token for a short-lived publish credential, so no NPM_TOKEN secret
      # is needed once the trusted publisher is configured on npmjs.com
      # (package settings -> Trusted publisher -> ashlrai/lexicon, release.yml).
      # A configured NPM_TOKEN still works as a fallback.
      - name: Use an npm CLI that supports trusted publishing
        run: npm install -g "npm@^11.5.1" && npm --version
      - name: Require publish credentials and prove publication absence
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-contract.mjs preflight "$VERSION"
      - name: Publish original qualified npm archive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./release/ashlr-lexicon-${VERSION}.tgz" --provenance --access public
      - name: Accept exact npm version and archive integrity
        run: node scripts/release-contract.mjs registry release "$VERSION"
      - name: Create draft and upload complete assets without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" \
            "release/ashlr-lexicon-${VERSION}.tgz" \
            release/lexicon-extension.zip release/lexicon-extension-firefox.zip \
            release/LexiconBar.app.zip release/SHA256SUMS
      - name: Verify exact draft asset inventory and hosted bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets > draft-receipt.json
          gh release download "$GITHUB_REF_NAME" --dir hosted
          node scripts/release-contract.mjs hosted hosted "$VERSION" draft-receipt.json draft
          cmp release/SHA256SUMS hosted/SHA256SUMS
      - name: Recheck registry acceptance and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-contract.mjs registry release "$VERSION"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets > public-receipt.json
          gh release download "$GITHUB_REF_NAME" --dir public-hosted
          node scripts/release-contract.mjs hosted public-hosted "$VERSION" public-receipt.json public
          cmp release/SHA256SUMS public-hosted/SHA256SUMS
