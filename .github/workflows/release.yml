# Qualify every asset before publication. Preserve the original npm archive.
# An existing release/version is refused; recovery is a reviewed fix-forward release.
name: Release

on:
  push:
    tags: ['v*']
  # Manual path (one command): gh workflow run release.yml -R ashlrai/lexicon -f version=X.Y.Z
  # Releases tag vX.Y.Z, which must already exist; the tag is checked out, not
  # the dispatch ref. Every gate below applies unchanged, and auto-tag.yml uses
  # this path when a tag push did not start the workflow.
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version to release (X.Y.Z); tag vX.Y.Z must already exist"
        required: true
        type: string

# One release at a time; an in-flight run is never cancelled and a queued run
# must still prove its version and release absent before publishing.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-suite-evidence:
    # Release gate: the full suite (macOS and Windows included) must have
    # passed in a manual workflow_dispatch run of CI on this exact sha.
    name: Full suite green on release sha
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve and require the release tag
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version input '$INPUT_VERSION' is not X.Y.Z"; exit 1; }
            tag="v$INPUT_VERSION"
            # Peel annotated tags to the commit; lightweight tags resolve directly.
            sha="$(git ls-remote "https://github.com/$REPO.git" "refs/tags/$tag^{}" | awk '{print $1}')"
            [ -n "$sha" ] || sha="$(git ls-remote "https://github.com/$REPO.git" "refs/tags/$tag" | awk '{print $1}')"
            [ -n "$sha" ] || { echo "::error::tag $tag must already exist; tag it (auto-tag.yml) before releasing"; exit 1; }
          else
            tag="$GITHUB_REF_NAME"; sha="$GITHUB_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require a successful workflow_dispatch CI run on this sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          CI_WORKFLOW: ci.yml
        run: |
          set -euo pipefail
          n="$(gh api "repos/${REPO}/actions/workflows/${CI_WORKFLOW}/runs?event=workflow_dispatch&head_sha=${SHA}&status=success&per_page=1" --jq '.total_count')"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::No successful workflow_dispatch run of ${CI_WORKFLOW} on ${SHA}. Run 'gh workflow run ${CI_WORKFLOW} --ref <this ref>', wait for green, then release."
            exit 1
          fi
          echo "full suite green on ${SHA} (${n} run(s))"

  ubuntu:
    needs: [full-suite-evidence]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.full-suite-evidence.outputs.tag }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ format('refs/tags/{0}', needs.full-suite-evidence.outputs.tag) }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate all source version carriers
        id: meta
        run: |
          version=$(node scripts/release-contract.mjs source . "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: node --test scripts/release-contract.test.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:bundle
      - run: npm test
      - run: npm run check:facts
      - run: npm run check:server-json -- --offline
      - name: Verify generated CLI documentation
        run: npm run docs:cli && git diff --exit-code -- docs/CLI.md
      - name: Build the browser extension zips
        run: npm run build:extension
      - name: Pack qualified npm bytes once
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cp extension/lexicon-extension.zip extension/lexicon-extension-firefox.zip release/
          node scripts/release-contract.mjs checksum release "$VERSION" ubuntu
      - uses: actions/upload-artifact@v7
        with:
          name: lexicon-release-ubuntu
          path: release/*
          if-no-files-found: error

  macos:
    needs: [full-suite-evidence]
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.full-suite-evidence.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ format('refs/tags/{0}', needs.full-suite-evidence.outputs.tag) }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate all source version carriers
        run: node scripts/release-contract.mjs source . "$RELEASE_TAG"
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Unit tests (LexiconBarKit)
        working-directory: apps/macos/LexiconBar
        run: swift test
      - name: Package LexiconBar.app
        run: scripts/build-macos-app.sh
      - name: Verify bundle and capture qualified checksum
        run: |
          plutil -lint apps/macos/build/LexiconBar.app/Contents/Info.plist
          codesign --verify --verbose=2 apps/macos/build/LexiconBar.app
          mkdir release
          cp apps/macos/build/LexiconBar.app.zip release/
          version=$(node scripts/release-contract.mjs source . "$RELEASE_TAG")
          node scripts/release-contract.mjs checksum release "$version" macos
      - uses: actions/upload-artifact@v7
        with:
          name: lexicon-release-macos
          path: release/*
          if-no-files-found: error

  publish:
    needs: [full-suite-evidence, ubuntu, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.ubuntu.outputs.version }}
      RELEASE_TAG: ${{ needs.full-suite-evidence.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ format('refs/tags/{0}', needs.full-suite-evidence.outputs.tag) }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Revalidate source identity
        run: |
          version=$(node scripts/release-contract.mjs source . "$RELEASE_TAG")
          test "$version" = "$VERSION"
      - uses: actions/download-artifact@v8
        with:
          name: lexicon-release-ubuntu
          path: staged/ubuntu
      - uses: actions/download-artifact@v8
        with:
          name: lexicon-release-macos
          path: staged/macos
      - name: Validate complete qualified artifact closure
        run: node scripts/release-contract.mjs assemble staged release "$VERSION"
      # npm trusted publishing (OIDC): npm >= 11.5.1 exchanges this job's
      # id-token for a short-lived publish credential, so no NPM_TOKEN secret
      # is needed once the trusted publisher is configured on npmjs.com
      # (package settings -> Trusted publisher -> ashlrai/lexicon, release.yml).
      # OIDC only: token-based npm auth is refused (RQ-LEXNOTOKENQ8).
      - name: Use an npm CLI that supports trusted publishing
        run: npm install -g "npm@^11.5.1" && npm --version
      - name: Refuse token-based npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then echo "::error::token-based npm auth must not be configured"; exit 1; fi
      - name: Require publish credentials and prove publication absence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-contract.mjs preflight "$VERSION"
      - name: Publish original qualified npm archive
        run: npm publish "./release/ashlr-lexicon-${VERSION}.tgz" --provenance --access public
      - name: Accept exact npm version and archive integrity
        run: node scripts/release-contract.mjs registry release "$VERSION"
      - name: Create draft and upload complete assets without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --draft --generate-notes --verify-tag
          gh release upload "$RELEASE_TAG" \
            "release/ashlr-lexicon-${VERSION}.tgz" \
            release/lexicon-extension.zip release/lexicon-extension-firefox.zip \
            release/LexiconBar.app.zip release/SHA256SUMS
      - name: Verify exact draft asset inventory and hosted bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets > draft-receipt.json
          gh release download "$RELEASE_TAG" --dir hosted
          node scripts/release-contract.mjs hosted hosted "$VERSION" draft-receipt.json draft
          cmp release/SHA256SUMS hosted/SHA256SUMS
      - name: Recheck registry acceptance and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-contract.mjs registry release "$VERSION"
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets > public-receipt.json
          gh release download "$RELEASE_TAG" --dir public-hosted
          node scripts/release-contract.mjs hosted public-hosted "$VERSION" public-receipt.json public
          cmp release/SHA256SUMS public-hosted/SHA256SUMS
