# Publishes @ashlr/lexicon to npm and creates a GitHub release when a `v*` tag is pushed.
#
# Required repository secret:
#   NPM_TOKEN  - an npm "Automation" (or granular, publish-enabled) access token for the
#                @ashlr scope. Provenance attestation additionally needs the `id-token: write`
#                permission below; nothing else to configure.
#
# GITHUB_TOKEN is provided automatically and is used by `gh release create`.
#
# Release flow:
#   npm version minor            # bumps package.json + creates the tag
#   git push --follow-tags       # triggers this workflow
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm run build:bundle

      - run: npm test

      - name: Check the tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skipped npm publish
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN secret not set; skipping npm publish (GitHub release still created)"

      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
