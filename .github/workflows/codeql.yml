name: CodeQL

# Stays off pull_request. This repo has no merge queue, so merge_group
# never fires. Push to main is what runs the scan, plus the nightly
# schedule (07:43 UTC, clear of ashlr-md's 06:17 UTC) and workflow_dispatch.
on:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none is supported for every language in this matrix.
        # Swift (apps/macos) is not here: CodeQL none does not support Swift.
        include:
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: none
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
