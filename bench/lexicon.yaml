# Benchmark lexicon: what a founder/developer would realistically keep.
# 70 terms. Aliases are spellings Whisper / Apple / Google STT actually emit.
# Roughly 30% of terms deliberately have NO aliases so the phonetic and fuzzy
# passes are what gets measured for them (marked "# no aliases: measures ...").
# No `never` lists and no settings overrides: this is the naive out-of-the-box
# configuration. See docs/BENCHMARK.md for the never/protectedWords a user
# would add after a week of use and what they buy.
version: 1
terms:
